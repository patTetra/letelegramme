name: Scan quotidien des nouveautés tech

on:
  schedule:
    # Tous les jours à 6h00 UTC (~8h00 en France)
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # permet de le lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install feedparser

      - name: Lancer le scan
        working-directory: veille
        run: python scan.py

      - name: Commit du résultat si changement
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add veille/nouveautes.json
          git diff --staged --quiet || git commit -m "Mise à jour automatique des nouveautés"
          git push
