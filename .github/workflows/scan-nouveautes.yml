name: Scan quotidien des nouveautes tech

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dependances
        run: pip install feedparser

      - name: Lancer le scan
        working-directory: veille
        run: python scan.py

      - name: Commit du resultat si changement
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add veille/nouveautes.json
          git diff --staged --quiet || git commit -m "Mise a jour automatique des nouveautes"
          git push

